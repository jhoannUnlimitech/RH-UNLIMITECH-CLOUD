version: '3.8'

services:
  # ─── MongoDB ────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: rh-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Mongo Express (UI para MongoDB) ───────────────────
  mongo-express:
    image: mongo-express:latest
    container_name: rh-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/rh_management
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  # ─── Backend (Node.js + Express + TypeScript) ──────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rh-backend
    ports:
      - "9050:9050"
    environment:
      NODE_ENV: development
      PORT: 9050
      MONGO_URI: mongodb://mongodb:27017/rh_management
      JWT_SECRET: ${JWT_SECRET:-rh-unlimitech-dev-only-jwt-secret-key-2026-not-for-production}
      FRONTEND_URL: http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  # ─── Frontend (React + Vite) ───────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rh-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:9050/api/v1
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    restart: unless-stopped

volumes:
  mongo_data:
    driver: local
